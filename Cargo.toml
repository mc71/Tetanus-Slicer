[package]
name = "tetanus-slicer"
version = "0.1.0"
edition = "2021"

[dependencies]
rayon = "1.10"
byteorder = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
base64 = "0.22"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
clipper2-rust = "1.2.0"
serde_yaml = "0.9"
